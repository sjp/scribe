[workspace]
resolver = "3"
members = ["crates/scribe-core", "crates/scribe-cli", "crates/scribe-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjp/scribe"

[workspace.dependencies]
scribe-core = { version = "0.1.0", path = "crates/scribe-core" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
wasm-bindgen = "0.2.127"

[workspace.lints.rust]
missing_docs = "warn"
