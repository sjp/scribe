[workspace]
resolver = "3"
members = ["crates/scribe-core", "crates/scribe-cli", "crates/scribe-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjp/scribe"

[workspace.dependencies]
scribe-core = { version = "0.1.0", path = "crates/scribe-core" }

ab_glyph = "0.2.32"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
# No decoder is asked for here. Which formats are compiled in is a decision
# each crate makes through its own features, so a build carries only the
# decoders it was asked for.
image = { version = "0.25.10", default-features = false }
insta = "1.48.0"
js-sys = "0.3.104"
log = "0.4.34"
minijinja = "2.24.0"
predicates = "3.1.4"
roxmltree = "0.21.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
# Field order is kept so that a document written through `serde_json::Value`
# reads the same way as one serialised straight from the types it describes.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
wasm-bindgen = "0.2.127"

[workspace.lints.rust]
missing_docs = "warn"

# The OCR engine and its tensor library are unusably slow when built without
# optimisation, which makes debug builds of anything that runs them useless.
# Optimising dependencies leaves this workspace's own crates debuggable.
[profile.dev.package."*"]
opt-level = 3

# What ships is built once and run many times: the binary someone installs and
# the module a browser downloads before it can do anything. Both are worth a
# slower link. Nothing here unwinds out of a panic, so a release build aborts
# instead of carrying the machinery to walk back out of one.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
