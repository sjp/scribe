[workspace]
resolver = "3"
members = ["crates/scribe-core", "crates/scribe-cli", "crates/scribe-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjp/scribe"

[workspace.dependencies]
scribe-core = { version = "0.1.0", path = "crates/scribe-core" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
wasm-bindgen = "0.2.127"

[workspace.lints.rust]
missing_docs = "warn"

# The OCR engine and its tensor library are unusably slow when built without
# optimisation, which makes debug builds of anything that runs them useless.
# Optimising dependencies leaves this workspace's own crates debuggable.
[profile.dev.package."*"]
opt-level = 3
