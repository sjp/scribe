name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo test --workspace

      - run: cargo test -p scribe-core --features decode-all

  wasm:
    name: WebAssembly build and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo check -p scribe-core -p scribe-wasm --target wasm32-unknown-unknown

      - run: cargo check -p scribe-core --features decode --target wasm32-unknown-unknown

      - run: cargo check -p scribe-core -p scribe-wasm --features decode-all --target wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install wasm-pack
        run: curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - run: scripts/build-wasm.sh

      # The models are not in this repository, so the test that needs them
      # reports itself skipped here and is run locally instead.
      - run: node --test 'crates/scribe-wasm/tests/node/**/*.test.mjs'
