[package]
name = "scribe-cli"
description = "Command line interface for scribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scribe"
path = "src/main.rs"

[features]
# The binary reads the formats an image usually arrives in. The rest are a
# build away, one format at a time or all of them together.
decode-dds = ["scribe-core/decode-dds"]
decode-farbfeld = ["scribe-core/decode-farbfeld"]
decode-hdr = ["scribe-core/decode-hdr"]
decode-ico = ["scribe-core/decode-ico"]
decode-openexr = ["scribe-core/decode-openexr"]
decode-pnm = ["scribe-core/decode-pnm"]
decode-qoi = ["scribe-core/decode-qoi"]
decode-tga = ["scribe-core/decode-tga"]
decode-all = ["scribe-core/decode-all"]

[dependencies]
scribe-core = { workspace = true, features = ["decode"] }
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
roxmltree.workspace = true

[lints]
workspace = true
