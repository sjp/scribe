[package]
name = "scribe-wasm"
description = "WebAssembly bindings for scribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Decoding of encoded images (PNG, JPEG, …) into pixel buffers, which is what
# `Engine.analyzeEncoded` needs. On by default: a browser hands out encoded
# images far more readily than pixels.
default = ["decode"]
decode = ["scribe-core/decode"]

[dependencies]
scribe-core.workspace = true
js-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
