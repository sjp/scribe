[package]
name = "scribe-wasm"
description = "WebAssembly bindings for scribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Decoding of encoded images (PNG, JPEG, …) into pixel buffers, which is what
# `Engine.analyzeEncoded` needs. On by default: a browser hands out encoded
# images far more readily than pixels.
default = ["decode"]
decode = ["scribe-core/decode"]

# The formats `decode` leaves out, each of which a build can be asked for.
decode-dds = ["scribe-core/decode-dds"]
decode-farbfeld = ["scribe-core/decode-farbfeld"]
decode-hdr = ["scribe-core/decode-hdr"]
decode-ico = ["scribe-core/decode-ico"]
decode-openexr = ["scribe-core/decode-openexr"]
decode-pnm = ["scribe-core/decode-pnm"]
decode-qoi = ["scribe-core/decode-qoi"]
decode-tga = ["scribe-core/decode-tga"]
decode-all = ["scribe-core/decode-all"]

[dependencies]
scribe-core.workspace = true
js-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

# wasm-pack runs wasm-opt over the module it builds, asking it for no more than
# `-O` by default. A browser downloads the module before it can run anything,
# so size is what it is optimised for. `-Oz` works over machine code the
# release profile still compiled at `opt-level = 3`, so recognition keeps its
# speed.
#
# The WebAssembly features have to be named here. They are the ones rustc
# enables for `wasm32-unknown-unknown` — `rustc --print cfg --target
# wasm32-unknown-unknown` lists them — and a module normally carries a section
# saying so, which the release profile's stripping takes with it. Without them
# wasm-opt refuses instructions the module is entitled to use.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
